<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mark-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="mark-grad-subtle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="nexus-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(50, 50)" filter="url(#nexus-glow)">
    <!-- Outer orbiting architectural frame -->
    <path d="M0 -34 L29.4 -17 L29.4 17 L0 34 L-29.4 17 L-29.4 -17 Z" 
          stroke="url(#mark-grad-primary)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="4 3" opacity="0.45"/>

    <!-- Dynamic Architectural Rhomboids / Nexus facets -->
    <!-- Top Diamond -->
    <path d="M0 -26 L22.5 -13 L0 0 L-22.5 -13 Z" 
          fill="url(#mark-grad-primary)" fill-opacity="0.95" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>

    <!-- Right Diamond -->
    <path d="M0 0 L22.5 -13 L22.5 13 L0 26 Z" 
          fill="url(#mark-grad-primary)" fill-opacity="0.75" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>

    <!-- Left Diamond -->
    <path d="M0 0 L0 26 L-22.5 13 L-22.5 -13 Z" 
          fill="url(#mark-grad-subtle)" fill-opacity="0.6" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>

    <!-- Central Node Core & Vector Connectors -->
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="7" stroke="#38BDF8" stroke-width="1.2" opacity="0.85"/>
    <circle cx="0" cy="-26" r="2" fill="#38BDF8"/>
    <circle cx="22.5" cy="13" r="2" fill="#6366F1"/>
    <circle cx="-22.5" cy="13" r="2" fill="#06B6D4"/>
  </g>
</svg>
